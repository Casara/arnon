    </g>
  </g>
  <g fill="none" stroke="#123a41" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 124.5 78 L 137.5 32 L 150.5 78"/>
    <path d="M 130.5 62 H 144.5"/>
    <path d="M 168.5 78 V 32 H 183.5 A 10 10 0 0 1 183.5 52 H 168.5"/>
