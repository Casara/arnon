name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    name: check (lint + arch-lint + test -race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - run: make check

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - run: make coverage

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coverage.html
